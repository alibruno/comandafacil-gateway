spring:
  application:
    name: backend
  datasource:
    url: jdbc:h2:mem:comandafacil;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET:comandafacil-academic-development-secret-2026}
    expiration: 86400000
