services:
  postgres:
    container_name: comandafacil_postgres
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DATABASE_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-admin}
      - POSTGRES_DB=${DATABASE_NAME:-comandafacil_db}
      - PGDATA=/var/lib/postgresql/18/docker/pgdata
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-comandafacil_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  pedidos:
    build: ./services/pedidos
    ports:
      - "8082:8000"
    environment:
      - DJANGO_DEBUG=true
      - DATABASE_ENGINE=postgres
      - DATABASE_NAME=${DATABASE_NAME:-comandafacil_db}
      - DATABASE_USER=${DATABASE_USERNAME:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-admin}
      - DATABASE_HOST=host.docker.internal
      - DATABASE_PORT=5432
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
