services:
  postgres:
    container_name: comandafacil_postgres
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DATABASE_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-admin}
      - POSTGRES_DB=${DATABASE_NAME:-comandafacil_db}
      - PGDATA=/var/lib/postgresql/18/docker/pgdata
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-comandafacil_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  pedidos:
    build: ./services/pedidos
    ports:
      - "8082:8000"
    environment:
      - DJANGO_DEBUG=false
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,host.docker.internal
      - DATABASE_ENGINE=postgres
      - DATABASE_NAME=${DATABASE_NAME:-comandafacil_db}
      - DATABASE_USER=${DATABASE_USERNAME:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-admin}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET com pelo menos 32 bytes no arquivo .env}
    depends_on:
      postgres:
        condition: service_healthy

  restaurantes:
    build: ./services/restaurantes
    ports:
      - "8081:8081"
    environment:
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET com pelo menos 32 bytes no arquivo .env}

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/${DATABASE_NAME:-comandafacil_db}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-admin}
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET com pelo menos 32 bytes no arquivo .env}
      - PEDIDOS_URL=http://pedidos:8000
      - RESTAURANTES_URL=http://restaurantes:8081
    depends_on:
      postgres:
        condition: service_healthy
      pedidos:
        condition: service_started
      restaurantes:
        condition: service_started

volumes:
  pgdata:
