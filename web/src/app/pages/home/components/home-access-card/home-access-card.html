<a
  class="group block h-full rounded-3xl text-inherit no-underline focus-visible:outline-3 focus-visible:outline-offset-4 focus-visible:outline-[#f99a26]/55"
  [routerLink]="route()"
>
  <p-card
    styleClass="access-card h-full min-h-[230px] overflow-hidden rounded-3xl border border-[#dccdc1]/53 bg-white shadow-[0_3px_12px_rgb(21_46_48/4%)] transition duration-200 motion-reduce:transition-none group-hover:-translate-y-1 group-hover:border-[#152e30]/20 group-hover:shadow-[0_16px_30px_rgb(21_46_48/9%),0_5px_12px_rgb(249_154_38/7%)] md:min-h-[278px]"
  >
    <div class="relative flex min-h-full flex-col items-start">
      <span
        class="mb-6 grid size-[58px] flex-none place-items-center rounded-[18px] transition duration-200 motion-reduce:transition-none group-hover:scale-105 md:mb-8 md:size-[66px]"
        [class]="
          accent() === 'amber'
            ? 'bg-[#f99a26] text-[#152e30] shadow-[0_4px_8px_rgb(249_154_38/20%)]'
            : 'bg-[#152e30] text-[#f99a26] shadow-[0_4px_8px_rgb(21_46_48/14%)]'
        "
        aria-hidden="true"
      >
        <span class="access-icon-symbol material-symbols-outlined text-[30px]">{{ icon() }}</span>
      </span>
      <h2
        class="m-0 max-w-[18ch] font-serif text-[1.55rem] font-semibold leading-tight text-[#152e30] transition-colors duration-200 motion-reduce:transition-none group-hover:text-[#a13711] md:text-[clamp(1.6rem,2.4vw,2rem)]"
      >
        {{ title() }}
      </h2>
      <span
        class="material-symbols-outlined absolute right-0 top-0 -translate-x-1 translate-y-1 text-[1.3rem] opacity-0 transition duration-200 motion-reduce:transition-none group-hover:translate-x-0 group-hover:translate-y-0 group-hover:opacity-100 group-focus-visible:translate-x-0 group-focus-visible:translate-y-0 group-focus-visible:opacity-100"
        [class]="accent() === 'amber' ? 'text-[#f99a26]' : 'text-[#77818c]'"
        aria-hidden="true"
      >
        north_east
      </span>
    </div>
  </p-card>
</a>
