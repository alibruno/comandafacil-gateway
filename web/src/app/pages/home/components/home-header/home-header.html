<header class="fixed inset-x-0 top-0 h-20 border-b border-[#dccdc1]/55 bg-white/86 backdrop-blur-lg">
  <div
    class="mx-auto flex h-full w-[calc(100%-2rem)] max-w-[1440px] items-center justify-between sm:w-[calc(100%-3rem)]"
  >
    <a
      class="block focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[#f99a26]/55"
      routerLink="/"
      aria-label="ComandaFácil, página inicial"
    >
      <img
        class="block h-auto w-[132px] sm:w-[148px]"
        ngSrc="/comanda-facil-logo.svg"
        width="540"
        height="140"
        priority
        alt="ComandaFácil"
      />
    </a>

    <nav class="flex items-center gap-2" aria-label="Acesso à conta">
      <p-button
        label="Login"
        type="button"
        [text]="true"
        styleClass="home-login-button min-h-[42px] rounded-full border-transparent bg-transparent px-3.5 py-2.5 text-[0.82rem] font-semibold text-[#152e30] transition hover:bg-[#152e30]/5 focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[#f99a26]/55 sm:min-h-[44px] sm:px-5 sm:text-[0.9rem]"
        (onClick)="openAuth('login')"
      />
      <p-button
        label="Cadastro"
        type="button"
        styleClass="home-register-button min-h-[42px] rounded-full border-[#f99a26] bg-[#f99a26] px-3.5 py-2.5 text-[0.82rem] font-semibold text-white shadow-[0_2px_5px_rgb(249_154_38/24%)] transition hover:-translate-y-px hover:bg-[#f28c18] hover:shadow-[0_5px_12px_rgb(249_154_38/25%)] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[#f99a26]/55 sm:min-h-[44px] sm:px-5 sm:text-[0.9rem]"
        (onClick)="openAuth('register')"
      />
    </nav>
  </div>
</header>
