<app-restaurant-header />

<main class="min-h-screen bg-[#f7f9ff] text-[#152e30] lg:pl-64">
  <section id="mesas" class="space-y-8 px-5 py-8 md:px-10">
    <div class="flex flex-col justify-between gap-5 md:flex-row md:items-end">
      <p class="max-w-xl text-sm leading-6 text-[#77818c]">
        Acompanhe a ocupação do salão e mantenha a disposição das mesas sempre atualizada.
      </p>
      <p-button
        class="cursor-pointer"
        label="Nova mesa"
        icon="pi pi-plus"
        (onClick)="openCreateModal()"
      />
    </div>

    <app-mesa-summary [mesas]="mesas()" />
    <app-mesa-table
      [mesas]="mesas()"
      (view)="openViewModal($event)"
      (edit)="openEditModal($event)"
      (remove)="openDeleteModal($event)"
    />
  </section>
</main>

<app-mesa-dialog
  [visible]="modalVisible()"
  [mode]="modalMode()"
  [selectedMesa]="selectedMesa()"
  (close)="closeModal()"
  (save)="saveMesa($event)"
  (remove)="deleteMesa()"
/>
