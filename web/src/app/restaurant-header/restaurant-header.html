<aside class="fixed inset-y-0 left-0 z-20 hidden w-64 flex-col justify-between bg-[#152e30] px-5 py-6 text-white lg:flex">
  <div class="space-y-10">
    <div>
      <a routerLink="/" aria-label="ComandaFácil, página inicial">
        <img ngSrc="/comanda-facil-logo-sidebar.svg" width="540" height="140" class="h-auto w-full max-w-52.5" alt="Comanda Fácil - Sistema de gestão de restaurantes" />
      </a>
    </div>
    <nav class="space-y-2" aria-label="Navegação principal">
      <a routerLink="/restaurante" class="flex cursor-pointer items-center gap-3 rounded-xl px-4 py-3 text-sm transition" [class.bg-[#f99a26]]="activeSection() === 'restaurant'" [class.font-bold]="activeSection() === 'restaurant'" [class.text-[#152e30]]="activeSection() === 'restaurant'" [class.text-[#dccdc1]]="activeSection() !== 'restaurant'" [attr.aria-current]="activeSection() === 'restaurant' ? 'page' : null"><span class="material-symbols-outlined" aria-hidden="true">storefront</span><span>Restaurante</span></a>
      <a routerLink="/pedidos" class="flex cursor-pointer items-center gap-3 rounded-xl px-4 py-3 text-sm transition" [class.bg-[#f99a26]]="activeSection() === 'orders'" [class.font-bold]="activeSection() === 'orders'" [class.text-[#152e30]]="activeSection() === 'orders'" [class.text-[#dccdc1]]="activeSection() !== 'orders'" [attr.aria-current]="activeSection() === 'orders' ? 'page' : null"><span class="material-symbols-outlined" aria-hidden="true">receipt_long</span><span>Pedidos</span></a>
    </nav>
  </div>
  <div class="rounded-xl border border-white/10 bg-white/5 p-4">
    <p class="text-xs uppercase tracking-widest text-[#dccdc1]">Serviço do jantar</p>
    <div class="mt-3 flex items-center justify-between text-sm">
      <span class="flex items-center gap-2"><span class="size-2 rounded-full bg-[#f99a26]"></span>Ativo</span><span class="font-bold text-[#f99a26]">18:00</span>
    </div>
  </div>
</aside>

<header class="flex min-h-20 items-center justify-between border-b border-[#77818c]/15 bg-white px-5 py-4 backdrop-blur lg:ml-64 md:px-10">
  <div>
    <p class="text-xs font-bold uppercase tracking-[0.2em] text-rose-900">Gestão &amp; salão</p>
    <h1 class="mt-1 font-sans text-3xl font-bold text-[#292725]">{{ pageTitle() }}</h1>
  </div>
  <div class="hidden items-center gap-3 sm:flex">
    <div class="grid size-10 place-items-center rounded-full bg-[#dccdc1] font-serif font-bold text-[#292725]">
      JR
    </div>
    <div class="hidden text-right md:block">
      <p class="text-sm font-bold text-[#5b5b58]">Julien Roy</p>
      <p class="text-xs text-[#5b5b58]">Maître D'</p>
    </div>
    <p-button label="Sair" type="button" [text]="true" styleClass="header-logout-button" (onClick)="logout()">
      <ng-template #icon>
        <span class="material-symbols-outlined" aria-hidden="true">logout</span>
      </ng-template>
    </p-button>
  </div>
</header>

<nav class="flex gap-2 border-b border-[#77818c]/15 bg-white px-5 py-2 lg:hidden" aria-label="Navegação principal">
  <a routerLink="/restaurante" class="rounded-lg px-3 py-2 text-sm font-semibold" [class.bg-[#f99a26]]="activeSection() === 'restaurant'" [class.text-[#152e30]]="activeSection() === 'restaurant'" [class.text-[#77818c]]="activeSection() !== 'restaurant'" [attr.aria-current]="activeSection() === 'restaurant' ? 'page' : null">Restaurante</a>
  <a routerLink="/pedidos" class="rounded-lg px-3 py-2 text-sm font-semibold" [class.bg-[#f99a26]]="activeSection() === 'orders'" [class.text-[#152e30]]="activeSection() === 'orders'" [class.text-[#77818c]]="activeSection() !== 'orders'" [attr.aria-current]="activeSection() === 'orders' ? 'page' : null">Pedidos</a>
  <p-button label="Sair" type="button" [text]="true" styleClass="header-logout-button header-logout-button--mobile" (onClick)="logout()">
    <ng-template #icon>
      <span class="material-symbols-outlined" aria-hidden="true">logout</span>
    </ng-template>
  </p-button>
</nav>
