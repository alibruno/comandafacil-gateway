<div class="grid gap-4 sm:grid-cols-3">
  <article class="rounded-2xl border border-[#77818c]/15 bg-white p-5 shadow-sm">
    <p class="text-xs font-bold uppercase tracking-widest text-[#77818c]">Total de mesas</p>
    <p class="mt-3 font-serif text-4xl font-bold">{{ mesas().length }}</p>
    <p class="mt-1 text-sm text-[#77818c]">em operação</p>
  </article>
  <article class="rounded-2xl border border-[#77818c]/15 bg-white p-5 shadow-sm">
    <p class="text-xs font-bold uppercase tracking-widest text-[#77818c]">Disponíveis</p>
    <p class="mt-3 font-serif text-4xl font-bold text-emerald-700">{{ availableCount() }}</p>
    <p class="mt-1 text-sm text-[#77818c]">prontas para receber</p>
  </article>
  <article class="rounded-2xl border border-[#77818c]/15 bg-white p-5 shadow-sm">
    <p class="text-xs font-bold uppercase tracking-widest text-[#77818c]">Ocupadas</p>
    <p class="mt-3 font-serif text-4xl font-bold text-[#a13711]">{{ occupiedCount() }}</p>
    <p class="mt-1 text-sm text-[#77818c]">em atendimento</p>
  </article>
</div>
