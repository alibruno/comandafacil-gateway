spring:
  application:
    name: restaurantes
  datasource:
    url: jdbc:h2:file:./data/restaurantes
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

server:
  port: 8081

springdoc:
  api-docs:
    path: /api/restaurantes/schema
  swagger-ui:
    path: /api/restaurantes/docs/

app:
  jwt:
    secret: ${JWT_SECRET}
